[package]
name = "treble-lang"
description = "A live coding language for treble"
license = "MIT"
repository = "https://github.com/MinIndustry/treble-lang"
version = "0.8.0"
edition = "2024"

[dependencies]
nom = "8.0"
# JSON for `info --json`, which has to work in a build without the renderer.
# The library itself does not use it outside `serve`, and nothing derives:
# the command line builds its JSON by hand, so no proc-macro comes along.
serde_json = "1.0"

# The language proper knows nothing about the engine, so both of these are
# optional: parsing a buffer must not drag in a DSP stack. `render` turns on the
# lowering half and the headless renderer that sits on it.
treble = { version = "0.4.3", optional = true }
hound = { version = "3.5", optional = true }
rayon = { version = "1.12", optional = true }
# `serve` adds a language server and a player on top of the renderer: JSON for
# the wire (above), and cpal for the sound card the renderer's samples are
# streamed to.
cpal = { version = "0.15.3", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
render = ["dep:treble", "dep:hound", "dep:rayon"]
plotting = ["render", "treble/plotting"]
serve = ["render", "dep:cpal"]

[[bench]]
name = "offline"
harness = false
required-features = ["render"]

[[bin]]
name = "treble-lang"
path = "src/main.rs"

# Compositional analysis tools. They read a piece's notes rather than its
# audio, because a harmonic claim ("every note comes from one collection") is a
# property of the notes and asserting it against samples would be guesswork.
[[example]]
name = "notes"
required-features = ["render"]

[[example]]
name = "clashes"
required-features = ["render"]
